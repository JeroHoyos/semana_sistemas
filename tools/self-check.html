<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Self-check</title>
</head>
<body>
  <!-- Open this file through a local server: it checks the logic that protects the live tables. -->
  <pre id="result"></pre>
  <script src="../js/data.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/doom.js"></script>
  <script>
    const failures = [];
    const check = (name, actual, expected) => {
      if (JSON.stringify(actual) !== JSON.stringify(expected)) failures.push(`${name}: got ${JSON.stringify(actual)}, expected ${JSON.stringify(expected)}`);
    };

    // Medals: ties share a place, nobody with points means shared gold, 0 points never earns a medal
    check('no points', medalFor(0, [0, 0]), 'gold');
    check('first', medalFor(50, [50, 20, 10, 5]), 'gold');
    check('tie', medalFor(20, [50, 20, 20, 10]), 'silver');
    check('third after tie', medalFor(10, [50, 20, 20, 10]), 'bronze');
    check('fourth', medalFor(5, [50, 20, 10, 5]), null);
    check('zero with others', medalFor(0, [50, 0]), null);

    // Medal by position/tier (RPC mi_puesto_sustometro output)
    check('medal tier 1', medalForTier(1), 'gold');
    check('medal tier 2', medalForTier(2), 'silver');
    check('medal tier 3', medalForTier(3), 'bronze');
    check('medal tier 4', medalForTier(4), null);
    check('medal tier null', medalForTier(null), null);
    check('medal tier zero', medalForTier(0), null);

    // Scare Meter pagination logic
    const nextOffset = (loaded) => loaded;
    const hasMore = (loaded, total) => loaded < total;
    check('page 1 next offset', nextOffset(10), 10);
    check('page 2 next offset', nextOffset(20), 20);
    check('has more pages when remaining', hasMore(10, 25), true);
    check('has more pages false when all loaded', hasMore(25, 25), false);

    // Clowns: every old rule still applies, and their points never count
    check('flag on row', isClown('a@unal.edu.co', 'Ana', { es_payaso: true }), true);
    check('text flag on monster', isClown('a@unal.edu.co', 'Ana', { monstruo: { es_payaso: 'true' } }), true);
    check('email', isClown('armarina@unal.edu.co', 'Ana'), true);
    check('binary name', isClown('a@unal.edu.co', '01101100'), true);
    check('exact name', isClown('a@unal.edu.co', 'Armarina'), true);
    check('name inside', isClown('a@unal.edu.co', 'Juan Armarina'), true);
    check('argenis email', isClown('argenis.marin@unal.edu.co', 'Ana'), true);
    check('argenis name', isClown('x@unal.edu.co', 'Argenis Marín'), true);
    check('argenis alias', isArgenisAlias('armarin@unal.edu.co', 'Ana'), true);
    check('largo alias', isLargoAlias('imlargo@unal.edu.co', '01101100'), true);
    check('regular person', isClown('ana@unal.edu.co', 'Ana Gómez'), false);
    check('clown points', scarePoints({ correo: 'imlargo@unal.edu.co', nombre: 'x', puntos: 500 }), 0);
    check('regular points', scarePoints({ correo: 'ana@unal.edu.co', nombre: 'Ana', puntos: '40' }), 40);

    // Text typed by users cannot become HTML
    check('escape', escapeHtml(`<img src=x onerror="a('b')">&`), '&lt;img src=x onerror=&quot;a(&#39;b&#39;)&quot;&gt;&amp;');
    check('escape empty', escapeHtml(null), '');

    // Hostile monsters neither inject attributes nor break the table
    check('bad color', monsterColor({ color: '"><script>' }), DEFAULT_MONSTER.color);
    check('good color', monsterColor({ color: '#2f9e5b' }), '#2f9e5b');
    check('no script in svg', drawCustomMonster({ color: '"><script>' }).includes('<script'), false);
    check('proto part', drawCustomMonster({ cuerpo: '__proto__', ojos: 'constructor' }).startsWith('<svg'), true);

    // Doom points (they go to the leaderboard, which accepts 1 to 1000)
    const doomRun = (seconds, kills, items, secrets) => doomScore({
      tics: seconds * 35, kills, totalKills: 6, items, totalItems: 37, secrets, totalSecrets: 3 });
    check('doom perfect', doomRun(30, 6, 37, 3).points, 1000);
    check('doom empty and slow', doomRun(300, 0, 0, 0).points, 0);
    check('doom mixed', doomRun(60, 3, 0, 1).points, 200 + 0 + 67 + 170);
    check('doom no secrets in level', doomScore({ tics: 0, kills: 0, totalKills: 0, items: 0, totalItems: 0, secrets: 0, totalSecrets: 0 }).points, 200);
    check('doom lines add up', doomRun(45, 2, 10, 0).lines.length, 4);

    // Hostile team banners (equipos.bandera) neither inject markup nor break the team list
    const hostileBanner = drawBanner({ letras: '<img src=x onerror=alert(1)>', fondo: '"><script>', tinta: 'red', fuente: '__proto__', adorno: 'constructor' });
    check('banner no tags', /<(img|script)/.test(hostileBanner), false);
    check('banner bad colors', hostileBanner.includes(`fill="${DEFAULT_BANNER.fondo}"`) && hostileBanner.includes(`fill="${DEFAULT_BANNER.tinta}"`), true);
    check('banner four letters', drawBanner({ letras: 'ΣΣΚΑΒ' }).includes('>ΣΣΚΑ</text>'), true);
    check('banner good colors', drawBanner({ fondo: '#2f8f5b', tinta: '#f5c814' }).includes('fill="#f5c814"'), true);

    // The games of the day reset at midnight in Colombia (UTC-5), like registrar_puntaje_juego counts them
    check('colombia before midnight', colombiaDay(new Date('2026-11-05T04:59:00Z')), '2026-11-04');
    check('colombia after midnight', colombiaDay(new Date('2026-11-05T05:00:00Z')), '2026-11-05');

    check('handle', handleOf('ana@unal.edu.co'), 'ana');
    check('accents', stripAccents('Fútbol'), 'Futbol');

    // Secret titles and rewards
    check('franco impero title', findTitle('franco-impero')?.name, 'Franco Impero 🇮🇹');
    check('smoking accessory svg', drawCustomMonster({ accesorio: 'smoking' }).includes('monster-smoking'), true);

    // Carnet daily edit limit logic
    const canEdit = (edits, isSupervisor = false) => isSupervisor || edits < 2;
    check('carnet edits allowed under limit', canEdit(0), true);
    check('carnet edits allowed 1', canEdit(1), true);
    check('carnet edits blocked at limit', canEdit(2), false);
    check('carnet edits blocked above limit', canEdit(3), false);
    check('supervisor bypasses carnet limit', canEdit(5, true), true);

    // Scare Meter 5-hour cache logic
    const isSustometroCacheValid = (ageMs) => ageMs < 5 * 60 * 60 * 1000;
    check('sustometro cache valid at 1 hour', isSustometroCacheValid(1 * 3600 * 1000), true);
    check('sustometro cache valid at 4.9 hours', isSustometroCacheValid(4.9 * 3600 * 1000), true);
    check('sustometro cache expired at 5.1 hours', isSustometroCacheValid(5.1 * 3600 * 1000), false);

    // Snake 10-minute cache & top 10 trigger logic
    const isRecordsCacheValid = (ageMs) => ageMs < 10 * 60 * 1000;
    check('records cache valid at 5 min', isRecordsCacheValid(5 * 60 * 1000), true);
    check('records cache expired at 11 min', isRecordsCacheValid(11 * 60 * 1000), false);
    const qualifiesTop10 = (records, score) => records.length < 10 || score > (records[records.length - 1]?.mejor_puntaje || 0);
    check('qualifies top 10 when leaderboard has space', qualifiesTop10([{ mejor_puntaje: 50 }], 10), true);
    check('qualifies top 10 when score beats 10th place', qualifiesTop10(Array(10).fill({ mejor_puntaje: 100 }), 150), true);
    check('does not qualify top 10 when score is below 10th', qualifiesTop10(Array(10).fill({ mejor_puntaje: 100 }), 50), false);

    // Daily wrong codes limit logic (max 3 failed codes per day)
    const isCodeAttemptAllowed = (failedToday, isSupervisor = false) => isSupervisor || failedToday < 3;
    check('code attempt allowed at 0 fails', isCodeAttemptAllowed(0), true);
    check('code attempt allowed at 2 fails', isCodeAttemptAllowed(2), true);
    check('code attempt blocked at 3 fails', isCodeAttemptAllowed(3), false);
    check('code attempt blocked above 3 fails', isCodeAttemptAllowed(4), false);
    check('supervisor bypasses code attempts limit', isCodeAttemptAllowed(5, true), true);

    // Night suspension schedule (10:30 PM to 7:00 AM Colombia time, America/Bogota UTC-5)
    check('suspension before 22:30', isNightSuspension(new Date('2026-11-05T03:29:00Z')), false);
    check('suspension at 22:30', isNightSuspension(new Date('2026-11-05T03:30:00Z')), true);
    check('suspension at midnight', isNightSuspension(new Date('2026-11-05T05:00:00Z')), true);
    check('suspension at 06:59', isNightSuspension(new Date('2026-11-05T11:59:00Z')), true);
    check('suspension ends at 07:00', isNightSuspension(new Date('2026-11-05T12:00:00Z')), false);
    check('suspension noon', isNightSuspension(new Date('2026-11-05T17:00:00Z')), false);

    // Supervisor privilege: only app_metadata.supervisor is trusted (user_metadata injection is rejected)
    check('supervisor valid in app_metadata', isCurrentSupervisor({ app_metadata: { supervisor: true } }), true);
    check('supervisor rejected from titulos array in user_metadata', isCurrentSupervisor({ user_metadata: { titulos: ['supervisor'] } }), false);
    check('supervisor rejected from titulo string in user_metadata', isCurrentSupervisor({ user_metadata: { titulo: 'supervisor' } }), false);
    check('supervisor rejected on empty user', isCurrentSupervisor(null), false);
    check('supervisor recognized by email', isSupervisorAccount('saescobara@unal.edu.co'), true);
    check('supervisor recognized by handle', isSupervisorAccount('linavarrop'), true);
    check('supervisor recognized by name', isSupervisorAccount('x@unal.edu.co', 'Juan David Perez Lopez'), true);
    check('supervisor is never clown', isClown('saescobara@unal.edu.co', 'Santiago Escobar Arias', { es_payaso: true }), false);
    check('luzarait recognized as supervisor by handle', isSupervisorAccount('lcanasq'), true);
    check('luzarait recognized as supervisor by email', isSupervisorAccount('lcanasq@unal.edu.co'), true);
    check('luzarait recognized as supervisor by name', isSupervisorAccount('x@unal.edu.co', 'Luzarait Cañas Quintero'), true);
    check('luzarait is never clown', isClown('lcanasq@unal.edu.co', 'Luzarait Cañas Quintero', { es_payaso: true }), false);
    check('find group unalgoritmo', findGroup('unalgoritmo')?.name, 'UNAlgoritmo');
    check('find company lovelytics', findGroup('lovelytics')?.name, 'Lovelytics');
    check('find company sole', findGroup('sole')?.name, 'Solē');
    check('find company tcs', findGroup('tcs')?.name, 'TCS');

    document.getElementById('result').textContent = failures.length ? `FAILED\n${failures.join('\n')}` : 'ALL PASSED';
  </script>
</body>
</html>
